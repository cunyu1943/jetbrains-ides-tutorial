# 构建 VitePress 站点并将其部署到 GitHub Pages
name: 🎈 Deploy VitePress site to Pages

on:
  push:
    branches: [main]   # 默认分支为 main，若为 master 请修改
  workflow_dispatch:   # 支持手动触发

# 设置 Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制：仅允许一个 Pages 部署任务运行，防止冲突
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # -------- 构建阶段 --------
  build:
    # 🔥 改动 1：显式锁定 Runner 版本，避免 "hosted runner 未获取" 错误
    runs-on: ubuntu-24.04
    
    # 🔥 改动 2：增加超时防御，避免卡死在排队阶段浪费配额
    timeout-minutes: 30

    steps:
      - name: 🎆 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 保留 Git 历史，用于 VitePress 的 lastUpdated 时间戳

      # 🔥 改动 3：使用 pnpm 官方最新 action，不写死版本号（读取 packageManager 字段）
      - name: 🛠 Setup pnpm
        uses: pnpm/action-setup@v4
        # 无需指定 version，自动读取 package.json 中的 "packageManager": "pnpm@9.x.x"

      - name: 🛠 Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 🔥 改动 4：切换至 Node 20 LTS（稳定性首选）
          node-version: 20
          # 开启 pnpm 缓存，并显式指定 lock 文件路径，提高命中率
          cache: pnpm
          # cache-dependency-path: pnpm-lock.yaml

      # 🔥 改动 5：升级 configure-pages 至 v5
      - name: 🔧 Setup Pages
        uses: actions/configure-pages@v5

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile  # 生产环境必须使用锁文件

      - name: 🏗️ Build with VitePress
        run: pnpm docs:build
        env:
          NODE_OPTIONS: --max-old-space-size=4096  # 若站点较大，增加内存限制

      # 🔥 改动 6：upload artifact 使用官方推荐写法
      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 确保路径与你的 VitePress 配置（srcDir）一致
          path: docs/.vitepress/dist

  # -------- 部署阶段 --------
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-24.04  # 同样锁定版本
    name: Deploy
    steps:
      # 🔥 改动 7：deploy-pages 保持 v4（最新），没问题
      - name: 🎉 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4